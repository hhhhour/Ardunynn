[unit_type]
	id=ARDN Elite Peltast
	name= _ "Elite Peltast"
	race=human
	profile="portraits/humans/javelineer.webp"
	image="units/loyalists/peltast_elite.png"
	description = _ "Fast-moving fighters adept at harassing their opponents on the battlefield. They are capable of standing and fighting in hand-to-hand combat, but much prefer to keep their distance, using their javelins to disrupt troop movements, block a sudden retreat or sow confusion in the ranks."
	hitpoints=58
	experience=150
	movement_type=smallfoot
	movement=7
	cost=44
	level=3
	alignment=lawful
	usage=fighter
	advances_to=null
	{AMLA_DEFAULT}
	die_sound={SOUND_LIST:HUMAN_DIE}
	{DEFENSE_ANIM_RANGE "units/loyalists/peltast_elite.png" "units/loyalists/peltast_elite.png" {SOUND_LIST:HUMAN_HIT} melee}
	{DEFENSE_ANIM_RANGE "units/loyalists/peltast_elite.png" "units/loyalists/peltast_elite.png" {SOUND_LIST:HUMAN_HIT} ranged}
	[resistance]
		pierce=60
	[/resistance]
	[special_note]
		note= _ "Compared to other loyalists, Javelineers have a higher resistance to ‘pierce’ attacks."
	[/special_note]

	[attack]
		name=spear
		description=_"spear"
		type=pierce
		range=melee
		damage=18
		number=2
		icon=attacks/spear.png
	[/attack]
	[attack]
		name=javelin
		description=_"javelin"
		icon=attacks/javelin-human.png
		type=pierce
		range=ranged
		damage=12
		number=2
		[specials]
			{WEAPON_SPECIAL_SLOW}
		[/specials]
	[/attack]

	# Attack animations
	[attack_anim]
		[filter_attack]
			name=javelin
		[/filter_attack]
		missile_start_time=0
		[missile_frame]
			duration=150
			image="projectiles/spear-n.png"
			image_diagonal="projectiles/spear-ne.png"
		[/missile_frame]
		start_time=-250
		[frame]
			image="units/loyalists/peltast_elite.png"
		[/frame]
		attack_sound_start_time=-50
		[attack_sound_frame]
			duration=100
			sound={SOUND_LIST:THROW}
		[/attack_sound_frame]
		[if]
			hits=yes
			[attack_sound_frame]
				sound=spear.ogg
			[/attack_sound_frame]
		[/if]
	[/attack_anim]
[/unit_type]